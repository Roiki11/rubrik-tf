query {
      fusionComputeVirtualMachines(first: 10) {
        nodes {
          agentStatus
          authorizedOperations
          cdmId
          cdmLink
          cdmPendingObjectPauseAssignment
          clusterId
          clusterUuid
          disks
          fcVmId
          guestOsName
          hostId
          id
          ipAddresses
          isRelic
          isReplica
          name
          numWorkloadDescendants
          objectType
          onDemandSnapshotCount
          primaryClusterUuid
          replicatedObjectCount
          resourceSpec
          siteId
          slaAssignment
          slaPauseStatus
          snapshotConsistencyMandate
          vmName
          vrmId
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
