query GetCdmReleaseDetailsForClusterFromSupportPortal($listClusterUuid: [UUID!]!, $filterVersion: String!, $fetchLinks: Boolean!, $filterUpgradeable: Boolean!, $shouldShowAll: Boolean!, $filterAfterSource: Boolean!) {
      getCdmReleaseDetailsForClusterFromSupportPortal(
        listClusterUuid: $listClusterUuid
        filterVersion: $filterVersion
        fetchLinks: $fetchLinks
        filterUpgradeable: $filterUpgradeable
        shouldShowAll: $shouldShowAll
        filterAfterSource: $filterAfterSource
      ) {
        compatibilityMatrixLink
        supportSoftwareLink
      }
    }
