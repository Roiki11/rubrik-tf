query Db2Instance($id: UUID!) {
      db2Instance(id: $id) {
        authorizedOperations
        cdmId
        cdmPendingObjectPauseAssignment
        containsHadrDatabase
        id
        instanceType
        isReplica
        lastRefreshTime
        lastSyncTime
        name
        numWorkloadDescendants
        objectType
        primaryClusterUuid
        replicatedObjectCount
        slaAssignment
        slaPauseStatus
        status
        statusMessage
      }
    }
