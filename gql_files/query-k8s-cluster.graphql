query K8sCluster($fid: UUID!) {
      k8sCluster(fid: $fid) {
        authorizedOperations
        clusterIp
        id
        lastRefreshTime
        name
        numWorkloadDescendants
        objectType
        rscPendingObjectPauseAssignment
        slaAssignment
        slaPauseStatus
        status
      }
    }
