query SnapshotEventSearch($snappableFid: UUID!, $snapshotFid: UUID!, $orgId: UUID!) {
      snapshotEventSearch(
        snappableFid: $snappableFid
        snapshotFid: $snapshotFid
        orgId: $orgId
        first: 10
      ) {
        nodes {
          id
          parentFolderId
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
