query SnapshotOfSnappablesConnection($snappableIds: [String!]!) {
      snapshotOfSnappablesConnection(
        snappableIds: $snappableIds
        first: 10
      ) {
        nodes {
          date
          expirationDate
          id
          indexingAttempts
          isAnomaly
          isCorrupted
          isExpired
          isIndexed
          isOnDemandSnapshot
          isQuarantineProcessing
          isQuarantined
          isUnindexable
          snappableId
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
