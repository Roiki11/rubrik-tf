query {
      mongoSources(first: 10) {
        nodes {
          activeCollectionCount
          authorizedOperations
          caCertificateId
          cdmId
          cdmLink
          cdmPendingObjectPauseAssignment
          clusterUuid
          discoveryStatus
          id
          isArchived
          isRelic
          isReplica
          lastRefreshTime
          managementType
          name
          numWorkloadDescendants
          objectType
          onDemandSnapshotCount
          primaryClusterUuid
          protectedCollectionCount
          replicatedObjectCount
          slaAssignment
          slaPauseStatus
          sourceType
          status
          username
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
