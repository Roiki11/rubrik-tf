query SnappableEventSearch($snappableFid: UUID!, $orgId: UUID!) {
      snappableEventSearch(
        snappableFid: $snappableFid
        orgId: $orgId
        first: 10
      ) {
        nodes {
          id
          parentFolderId
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
