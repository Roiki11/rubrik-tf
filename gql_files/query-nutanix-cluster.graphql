query NutanixCluster($fid: UUID!) {
      nutanixCluster(fid: $fid) {
        authorizedOperations
        cdmId
        cdmPendingObjectPauseAssignment
        hostName
        id
        isReplica
        lastRefreshTime
        name
        naturalId
        nosVersion
        numWorkloadDescendants
        nutanixSnapshotConsistencyMandate
        objectType
        replicatedObjectCount
        slaAssignment
        slaPauseStatus
        userName
      }
    }
