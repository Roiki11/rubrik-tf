query PolicyObjFolderChildren($workloadId: String!, $snapshotId: String!, $stdPath: String!, $timezone: String!) {
      policyObjFolderChildren(
        workloadId: $workloadId
        snapshotId: $snapshotId
        stdPath: $stdPath
        timezone: $timezone
        first: 10
      ) {
        nodes {
          accessibleBySidsRepresentation
          accessibleBySidsRepresentationShortForm
          createdBy
          creationTime
          dbEntityType
          directory
          errorCode
          filename
          isDirectAcl
          lastAccessTime
          lastModifiedTime
          lastScanTime
          mode
          modifiedBy
          nativePath
          numActivities
          numActivitiesDelta
          numChildren
          numDescendantErrorFiles
          numDescendantFiles
          numDescendantFolders
          numDescendantSkippedExtFiles
          numDescendantSkippedSizeFiles
          openAccessType
          owner
          paginationId
          riskLevel
          riskReasons
          size
          snapshotFid
          snapshotTimestamp
          stalenessType
          stdPath
          totalSensitiveHits
          type
          userAccessType
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
