query SapHanaDatabase($fid: UUID!) {
      sapHanaDatabase(fid: $fid) {
        authorizedOperations
        backupTriggerType
        cdmId
        cdmLink
        cdmPendingObjectPauseAssignment
        clusterUuid
        dataPathType
        forceFull
        id
        isRelic
        isReplica
        name
        numWorkloadDescendants
        objectType
        onDemandSnapshotCount
        primaryClusterUuid
        protectionDate
        rbaRole
        replicatedObjectCount
        slaAssignment
        slaPauseStatus
        systemId
        totalSnapshotCount
      }
    }
