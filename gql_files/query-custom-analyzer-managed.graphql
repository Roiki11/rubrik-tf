query ManagedCustomAnalyzer($id: String!) {
  customAnalyzer(analyzerId: $id) {
    analyzerType
    dictionary
    dictionaryCsv
    excludeFieldNamePattern
    excludePathPattern
    excludeValueRegex
    id
    isInactive
    keyRegex
    name
    proximityDistance
    proximityKeywordsRegex
    regex
    risk
    ruleTypes
    structuredDictionary
    structuredDictionaryCsv
    structuredKeyDictionary
    structuredKeyDictionaryCsv
    structuredValueRegex
    tagId
  }
}
