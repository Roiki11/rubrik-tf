query ActivitySeries($input: ActivitySeriesInput!) {
      activitySeries(input: $input) {
        activitySeriesId
        attemptNumber
        causeErrorCode
        causeErrorMessage
        causeErrorReason
        causeErrorRemedy
        clusterName
        clusterUuid
        dataTransferred
        effectiveThroughput
        failureReason
        fid
        id
        isCancelable
        isOnDemand
        isPolarisEventSeries
        isTransactionLogEventSeries
        lastActivityMessage
        lastActivityStatus
        lastActivityType
        lastEventAddedAt
        lastUpdated
        lastVerifiedAt
        location
        logicalSize
        objectId
        objectName
        objectType
        orgId
        orgName
        progress
        severity
        slaDomainName
        startTime
        urlMetadata
        username
      }
    }
