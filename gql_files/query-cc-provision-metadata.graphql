query CcProvisionMetadata($input: CcProvisionMetadataReq!) {
      ccProvisionMetadata(input: $input) {
        clusterName
        clusterOpsCdmJobId
        clusterType
        clusterUuid
        internalTimestamp
        jobType
        marshaledConfig
        nodeToReplace
        progress
        status
        statusMessage
        tprRequestId
        vendor
      }
    }
