query FileSchemaResults($snapshotFid: String!, $snappableFid: String!, $stdPath: String!) {
      fileSchemaResults(
        snapshotFid: $snapshotFid
        snappableFid: $snappableFid
        stdPath: $stdPath
        first: 10
      ) {
        nodes {
          columnName
          columnType
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
