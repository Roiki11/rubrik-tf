query PureStorageProtectionGroupV1($id: UUID!) {
      pureStorageProtectionGroupV1(id: $id) {
        arrayId
        authorizedOperations
        cdmId
        cdmLink
        cdmPendingObjectPauseAssignment
        clusterUuid
        excludedVolumes
        id
        isRelic
        isReplica
        name
        numVolumes
        numWorkloadDescendants
        objectType
        onDemandSnapshotCount
        primaryClusterUuid
        pureStorageId
        replicatedObjectCount
        slaAssignment
        slaPauseStatus
      }
    }
