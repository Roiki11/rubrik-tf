query {
      postgreSQLDbClusters(first: 10) {
        nodes {
          authorizedOperations
          cdmId
          cdmLink
          cdmPendingObjectPauseAssignment
          clusterMode
          id
          isRelic
          isReplica
          name
          numWorkloadDescendants
          objectType
          onDemandSnapshotCount
          replicatedObjectCount
          slaAssignment
          slaPauseStatus
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
