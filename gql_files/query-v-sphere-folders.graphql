query {
      vSphereFolders(first: 10) {
        nodes {
          authorizedOperations
          cdmId
          cdmPendingObjectPauseAssignment
          datacenterId
          folderType
          id
          isReplica
          name
          numWorkloadDescendants
          objectType
          replicatedObjectCount
          slaAssignment
          slaPauseStatus
          snapshotConsistencyMandate
          snapshotConsistencySource
          vCenterId
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
