query MongoDatabase($fid: UUID!) {
      mongoDatabase(fid: $fid) {
        activeCollectionCount
        authorizedOperations
        cdmId
        cdmPendingObjectPauseAssignment
        clusterUuid
        id
        isRelic
        isReplica
        name
        numWorkloadDescendants
        objectType
        primaryClusterUuid
        protectedCollectionCount
        replicatedObjectCount
        slaAssignment
        slaPauseStatus
      }
    }
