mutation MutateRole(
  $id: String
  $name: String!
  $description: String!
  $permissions: [PermissionInput!]!
  $protectableClusters: [String!]!
) {
  mutateRole(
    roleId: $id
    name: $name
    description: $description
    permissions: $permissions
    protectableClusters: $protectableClusters
  )
}
