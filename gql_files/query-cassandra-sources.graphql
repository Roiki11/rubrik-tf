query {
      cassandraSources(first: 10) {
        nodes {
          backupCount
          clusterUuid
          id
          isRelic
          lastRefreshTime
          name
          nodeCount
          numWorkloadDescendants
          objectType
          rscPendingObjectPauseAssignment
          size
          slaAssignment
          slaPauseStatus
          sourceIp
          status
          watcherEnabled
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
