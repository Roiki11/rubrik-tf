query NutanixPrismCentral($fid: UUID!) {
      nutanixPrismCentral(fid: $fid) {
        authorizedOperations
        cdmId
        cdmPendingObjectPauseAssignment
        duplicateObjectsAbsoluteCount
        hostName
        id
        isDrEnabled
        isReplica
        lastRefreshTime
        name
        naturalId
        nosVersion
        numWorkloadDescendants
        nutanixClusterIds
        objectType
        replicatedObjectCount
        shouldUseV4
        slaAssignment
        slaPauseStatus
        userName
      }
    }
