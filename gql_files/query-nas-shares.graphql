query {
      nasShares(first: 10) {
        nodes {
          authorizedOperations
          cdmId
          cdmPendingObjectPauseAssignment
          connectedThrough
          exportPoint
          hostAddress
          hostIdForRestore
          id
          isChangelistEnabled
          isHidden
          isNasShareManuallyAdded
          isNetAppSnapDiffEnabled
          isNutanixCftEnabled
          isRelic
          isReplica
          isStale
          name
          numWorkloadDescendants
          objectType
          replicatedObjectCount
          shareType
          slaAssignment
          slaPauseStatus
          userSelectedInterfaces
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
