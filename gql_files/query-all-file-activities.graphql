query AllFileActivities($ListFileActivitiesInput: ListFileActivitiesInput!, $FileActivitiesSort: FileActivitiesSort!) {
      allFileActivities(
        ListFileActivitiesInput: $ListFileActivitiesInput
        FileActivitiesSort: $FileActivitiesSort
        first: 10
      ) {
        nodes {
          numActivities
          paginationId
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
