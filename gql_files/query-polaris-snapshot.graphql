query PolarisSnapshot($snapshotFid: UUID!) {
      polarisSnapshot(snapshotFid: $snapshotFid) {
        archivalLocationId
        archivalLocationName
        backupType
        consistencyLevel
        date
        expirationDate
        expiryHint
        hasUnexpiredArchivedCopy
        hasUnexpiredReplica
        id
        indexTime
        indexingAttempts
        isAnomaly
        isArchivalCopy
        isArchived
        isCorrupted
        isDeletedFromSource
        isDownloadedSnapshot
        isExpired
        isIndexed
        isOnDemandSnapshot
        isQuarantineProcessing
        isQuarantined
        isRansomwareInvestigatedSnapshot
        isReplica
        isReplicated
        isRetentionLocked
        isSnapshotSearchable
        isUnindexable
        parentSnapshotId
        retentionLockModeAcrossLocations
        sequenceNumber
        snappableId
        sourceSnapshotId
        unexpiredArchivedSnapshotCount
        unexpiredReplicaCount
      }
    }
