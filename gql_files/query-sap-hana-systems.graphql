query {
      sapHanaSystems(first: 10) {
        nodes {
          authorizedOperations
          backupTriggerType
          cdmId
          cdmLink
          cdmPendingObjectPauseAssignment
          clusterUuid
          id
          instanceNumber
          isForceFullOnMasterChangeEnabled
          isRelic
          isReplica
          lastRefreshTime
          lastStatusUpdateTime
          name
          numWorkloadDescendants
          objectType
          onDemandSnapshotCount
          primaryClusterUuid
          rbaRole
          replicatedObjectCount
          sid
          slaAssignment
          slaPauseStatus
          status
          statusMessage
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
