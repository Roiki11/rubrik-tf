query PostgreSQLClustersByName($name: String!, $first: Int!, $after: String) {
  postgreSQLDbClusters(
    first: $first
    after: $after
    filter: [{ field: NAME_EXACT_MATCH, texts: [$name] }]
  ) {
    nodes {
      id
      name
    }
    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
