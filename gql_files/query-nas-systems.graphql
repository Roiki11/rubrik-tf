query {
      nasSystems(first: 10) {
        nodes {
          authorizedOperations
          cdmId
          cdmPendingObjectPauseAssignment
          id
          isChangelistEnabled
          isNetAppMetroClusterEnabled
          isNetAppSnapDiffEnabled
          isNfsSupported
          isNutanixCftEnabled
          isRelic
          isReplica
          isSmbSupported
          isUserSuppliedSmbCredentials
          lastRefreshTime
          lastStatus
          name
          namespaceCount
          nfsPseudoFsPrefix
          numWorkloadDescendants
          objectType
          osVersion
          replicatedObjectCount
          shareCount
          slaAssignment
          slaPauseStatus
          userSelectedNfsInterfaces
          userSelectedSmbInterfaces
          vendorType
          volumeCount
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
