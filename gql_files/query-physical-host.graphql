query PhysicalHost($fid: UUID!) {
      physicalHost(fid: $fid) {
        adDomain
        agentId
        agentPrimaryClusterUuid
        authorizedOperations
        cbtStatus
        cdmId
        cdmLink
        cdmPendingObjectPauseAssignment
        clusterRelation
        defaultCbt
        id
        ipAddresses
        isArchived
        isChangelistEnabled
        isExchangeHost
        isMssqlHost
        isOracleHost
        isReplica
        lastSuccessfulUpgradeTime
        name
        nasApiEndpoint
        nasApiHostname
        nasMigrationInfo
        nasVendorType
        networkThrottle
        numWorkloadDescendants
        objectType
        osName
        osType
        rbaPackageUpgradeInfo
        rbsUpgradeStatus
        rbsVersion
        replicatedObjectCount
        resourceInfo
        slaAssignment
        slaPauseStatus
        vfdState
      }
    }
