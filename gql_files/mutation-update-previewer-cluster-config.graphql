mutation UpdatePreviewerClusterConfig($previewerClusterConfig: PreviewerClusterConfigInput!) {
      updatePreviewerClusterConfig(previewerClusterConfig: $previewerClusterConfig) {
        cdmRbacMigrationStatus
        connectivityLastUpdated
        cyberEventLockdownMode
        defaultAddress
        defaultPort
        encryptionEnabled
        eosDate
        eosStatus
        estimatedRunway
        id
        isAirGapped
        isAssignedByParentAccount
        isClusterRemovalTprEnabled
        isHealthy
        isTprEnabled
        isTunnelEnabled
        lastConnectionTime
        licensedProducts
        managementType
        name
        passesConnectivityCheck
        pauseStatus
        productType
        rawAddress
        registeredMode
        registrationTime
        snapshotCount
        status
        statusFromDb
        subStatus
        systemStatus
        systemStatusMessage
        timezone
        type
        version
      }
    }
