query SigninLogDetails($eventId: String!) {
      signinLogDetails(eventId: $eventId) {
        actorDisplayName
        actorDomain
        actorId
        actorPrincipalName
        actorSid
        actorUserType
        additionalData
        applicationId
        applicationName
        authenticationMethod
        authenticationPackage
        city
        correlationId
        country
        countryCode
        deviceName
        deviceOs
        errorCode
        eventId
        eventTimestamp
        eventTitle
        eventType
        ingestionTimestamp
        ipAddress
        logonType
        logonTypeDescription
        mfaMethod
        mfaStatus
        processName
        provider
        resourceId
        resourceName
        result
        resultReason
        riskIndicators
        riskLevel
        sessionId
        state
        targetDisplayName
        targetDomain
        targetId
        targetPrincipalName
        targetSid
        tenantId
      }
    }
