query {
      ransomwareResults(first: 10) {
        nodes {
          clusterUuid
          encryptionProbability
          id
          isEncrypted
          managedId
          snapshotData
          snapshotFid
          snapshotId
          workloadId
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
